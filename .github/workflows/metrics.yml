name: Metrics

on:
  # Rebuild the card every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Rebuild when the workflow file itself changes
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: StphenThy
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila
          config_animations: yes
          config_display: large

          # ── Isometric 3D contribution calendar (like the reference image)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ── Coding habits: commits per hour / per day, language activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          # ── Most used languages bar
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 8
          plugin_languages_colors: github

          # ── Contribution calendar + streaks
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # ── Achievements & activity
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          # ── Stargazers & followers over time
          plugin_stargazers: yes
          plugin_followup: yes

          # ── Lines of code added/removed
          plugin_lines: yes
