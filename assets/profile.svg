      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.88; } 50% { transform: scale(1.028); opacity: 1; } }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 4.5s ease-in-out 1.9s infinite; }
      @keyframes clip0 { 0% { width: 0px; animation-timing-function: steps(10,jump-end); } 10% { width: 90px; animation-timing-function: steps(1,jump-end); } 23.333% { width: 90px; animation-timing-function: steps(10,jump-end); } 30% { width: 0px; animation-timing-function: steps(1,jump-end); } 100% { width: 0px; } }
